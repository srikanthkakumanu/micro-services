# This docker compose file is designed for runtime.
# Images are built separately using `docker buildx bake`.

services:

  ## Hashicorp Vault for secret's
  ## Vault Dev
  vault:
    image: hashicorp/vault:latest
    container_name: vault
    restart: on-failure
    ports:
      - "8200:8200"
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=${VAULT_TOKEN:?Set a local development Vault token}
      - VAULT_TOKEN=${VAULT_TOKEN:?Set a local development Vault token}
      - SPRING_ACTIVE_PROFILE=${SPRING_ACTIVE_PROFILE:-dev}
      - DB_RUNTIME_PASSWORD=${DB_RUNTIME_PASSWORD:?Set runtime password from local configuration}
      - USER_FLYWAY_PASSWORD=${USER_FLYWAY_PASSWORD:?Set useradmin password}
      - AUTH_FLYWAY_PASSWORD=${AUTH_FLYWAY_PASSWORD:?Set authadmin password}
      - BOOKS_FLYWAY_PASSWORD=${BOOKS_FLYWAY_PASSWORD:?Set bookadmin password}
      - VIDEO_FLYWAY_PASSWORD=${VIDEO_FLYWAY_PASSWORD:?Set videoadmin password}
      - REVIEWS_FLYWAY_PASSWORD=${REVIEWS_FLYWAY_PASSWORD:?Set reviewsadmin password}
      - KEYCLOAK_ISSUER_URI=${KEYCLOAK_ISSUER_URI:?Set the development issuer}
      - KEYCLOAK_BASE_URL=${KEYCLOAK_BASE_URL:?Set the Keycloak base URL}
      - KEYCLOAK_ADMIN_CLIENT_SECRET=${KEYCLOAK_ADMIN_CLIENT_SECRET:?Set the User service client secret}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM:-company-platform}
      - KEYCLOAK_ADMIN_CLIENT_ID=${KEYCLOAK_ADMIN_CLIENT_ID:-user-service}
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200
      #      - VAULT_LOG_LEVEL=debug
      # This address is used by the vault CLI inside the container
      - VAULT_ADDR=http://127.0.0.1:8200
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: [ "CMD-SHELL", "test -f /tmp/vault-bootstrap-ready && vault status -address=http://127.0.0.1:8200 >/dev/null" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 60s
    volumes:
      # Mount the entrypoint script and init script into the container that we just created
      - ./vault/config/vault-entrypoint.sh:/usr/local/bin/vault-entrypoint.sh:ro
      - ${VAULT_SEED_SCRIPT:-./vault/config/bootstrap-dev-secrets.sh}:/usr/local/bin/init-vault-secrets.sh:ro
      # Dev mode is memory-backed; this volume does not persist dev secrets.
      - vault:/vault/data
    # Use the script as the entrypoint for the container
    entrypoint: [ "sh", "/usr/local/bin/vault-entrypoint.sh" ]
    logging: # To disable logs to print in the container
      driver: none
    networks:
      - apps-network

  # PostgreSQL
  postgres:
    image: postgres:18
    container_name: postgres
    restart: on-failure
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U root -d postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: # To disable logs to print in the container
      driver: none
    networks:
      - apps-network

  # Keycloak identity provider
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak
    restart: on-failure
    command: ["start-dev", "--import-realm"]
    ports:
      - "8080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD:?Set the local Keycloak administrator password}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: theuser
      KC_DB_PASSWORD: ${DB_RUNTIME_PASSWORD:?Set runtime password from local configuration}
      KC_HEALTH_ENABLED: true
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}
      KEYCLOAK_API_AUDIENCE: ${KEYCLOAK_API_AUDIENCE:-company-platform-api}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:?Set the User service client secret}
      AUTH_SERVICE_CLIENT_SECRET: ${AUTH_SERVICE_CLIENT_SECRET:?Set the auth service client secret}
      BOOKS_SERVICE_CLIENT_SECRET: ${BOOKS_SERVICE_CLIENT_SECRET:?Set the books service client secret}
      VIDEO_SERVICE_CLIENT_SECRET: ${VIDEO_SERVICE_CLIENT_SECRET:?Set the video service client secret}
      REVIEWS_SERVICE_CLIENT_SECRET: ${REVIEWS_SERVICE_CLIENT_SECRET:?Set the reviews service client secret}
      GATEWAY_CLIENT_SECRET: ${GATEWAY_CLIENT_SECRET:?Set the gateway service client secret}
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - apps-network

  # Eureka-Discovery-service
  eureka-discovery-service:
    image: eureka-discovery-service:latest
    container_name: eureka-discovery-service
    ports:
      - "9111:9111"
    environment:
      - EUREKA_INSTANCE_HOSTNAME=eureka-discovery-service
      - EUREKA_INSTANCE_PREFER_IPADDRESS=true  # Replace the value with false to use hostnames
      - SPRING_ACTIVE_PROFILE=dev
      - SERVER_PORT=9111
      - EUREKA_CLIENT_USERNAME=${EUREKA_CLIENT_USERNAME:-registry-client}
      - EUREKA_CLIENT_PASSWORD=${EUREKA_CLIENT_PASSWORD:?Set registry client password}
      - EUREKA_ADMIN_USERNAME=${EUREKA_ADMIN_USERNAME:-registry-admin}
      - EUREKA_ADMIN_PASSWORD=${EUREKA_ADMIN_PASSWORD:?Set registry administrator password}
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9111/actuator/health/readiness" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - apps-network

  # Cloud Config Server Service
  cloud-config-service:
    image: cloud-config-service:latest
    container_name: cloud-config-service
    depends_on:
      eureka-discovery-service:
        condition: service_healthy
    ports:
      - "9311:9311"
    volumes:
      - ../service-configs:/application/service-configs:ro
    environment:
      - SPRING_APP_NAME=cloud-config-service
      - SPRING_CLOUD_VAULT_ENABLED=false
      - SERVER_PORT=9311
      - ROOT_LOG_LEVEL=info
      - SPRING_ACTIVE_PROFILE=dev,native
      - SERVLET_CONTEXT_PATH=/config
      - EUREKA_ENABLED=true
      - CONFIG_CLIENT_USERNAME=${CONFIG_CLIENT_USERNAME:-config-client}
      - CONFIG_CLIENT_PASSWORD=${CONFIG_CLIENT_PASSWORD:?Set Config reader password}
      - CONFIG_ADMIN_USERNAME=${CONFIG_ADMIN_USERNAME:-config-admin}
      - CONFIG_ADMIN_PASSWORD=${CONFIG_ADMIN_PASSWORD:?Set Config administrator password}
      - EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE=http://${EUREKA_CLIENT_USERNAME:-registry-client}:${EUREKA_CLIENT_PASSWORD:?Set registry client password}@eureka-discovery-service:9111/eureka/
      - VAULT_HOST=vault
      - VAULT_PORT=8200
      - VAULT_TOKEN=${VAULT_TOKEN:?Set a local development Vault token}
      - FILE_SYSTEM_URL=/application/service-configs
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9311/config/actuator/health/readiness" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - apps-network

  # API Gateway
  api-gateway:
    image: api-gateway:latest
    container_name: api-gateway
    depends_on:
      keycloak:
        condition: service_started
      eureka-discovery-service:
        condition: service_healthy
    ports:
      - "9211:9211"
    environment:
      - SPRING_APP_NAME=api-gateway
      - EUREKA_ENABLED=true
      - USER_SERVICE_URI=http://user-service:9121
      - AUTH_SERVICE_URI=http://auth-service:9141
      - BOOKS_SERVICE_URI=http://books-service:9151
      - VIDEO_SERVICE_URI=http://video-service:9161
      - SERVER_PORT=9211
      - SPRING_ACTIVE_PROFILE=dev
      - EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE=http://${EUREKA_CLIENT_USERNAME:-registry-client}:${EUREKA_CLIENT_PASSWORD:?Set registry client password}@eureka-discovery-service:9111/eureka/
      - KEYCLOAK_ISSUER_URI=${KEYCLOAK_ISSUER_URI:?Set the public development issuer}
      - KEYCLOAK_API_AUDIENCE=${KEYCLOAK_API_AUDIENCE:-company-platform-api}
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://keycloak:8080/realms/company-platform/protocol/openid-connect/certs
      - REVIEWS_SERVICE_URI=http://reviews-service:9171
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9211/actuator/health/readiness" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 50s
    networks:
      - apps-network

  # User microservice
  user-service:
    image: user-service:latest
    container_name: user-service
    depends_on:
      vault:
        condition: service_healthy
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      eureka-discovery-service:
        condition: service_healthy
      api-gateway:
        condition: service_started
      cloud-config-service:
        condition: service_started
    ports:
      - "9121:9121"
    environment:
      - SPRING_APP_NAME=user-service
      - SERVER_PORT=9121
      - SPRING_JPA_HIBERNATE_DDL_AUTO=validate
      - SPRING_JPA_HIBERNATE_SHOW_SQL=false
      - SPRING_JPA_HIBERNATE_FORMAT_SQL=false
      - USER_SESSION_TIMEOUT=5m
      - EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE=http://${EUREKA_CLIENT_USERNAME:-registry-client}:${EUREKA_CLIENT_PASSWORD:?Set registry client password}@eureka-discovery-service:9111/eureka/
      - SPRING_ACTIVE_PROFILE=dev
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/userdb
      - SPRING_DATASOURCE_USERNAME=theuser
      - SPRING_DATASOURCE_PASSWORD=${DB_RUNTIME_PASSWORD:?Set runtime password from local configuration}
      - SPRING_FLYWAY_USER=useradmin
      - SPRING_FLYWAY_PASSWORD=${USER_FLYWAY_PASSWORD:?Set useradmin password}
      - KEYCLOAK_ISSUER_URI=${KEYCLOAK_ISSUER_URI:?Set the public development issuer}
      - KEYCLOAK_API_AUDIENCE=${KEYCLOAK_API_AUDIENCE:-company-platform-api}
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://keycloak:8080/realms/company-platform/protocol/openid-connect/certs
      - KEYCLOAK_BASE_URL=http://keycloak:8080
      - KEYCLOAK_REALM=company-platform
      - KEYCLOAK_ADMIN_CLIENT_ID=user-service
      - KEYCLOAK_ADMIN_CLIENT_SECRET=${KEYCLOAK_ADMIN_CLIENT_SECRET:?Set the User service client secret}
      - VAULT_HOST=vault
      - VAULT_PORT=8200
      - VAULT_TOKEN=${VAULT_TOKEN:?Set a local development Vault token}
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9121/actuator/health/readiness" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - apps-network

  # authorization microservice
  auth-service:
    image: auth-service:latest
    container_name: auth-service
    depends_on:
      vault:
        condition: service_healthy
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      eureka-discovery-service:
        condition: service_healthy
      api-gateway:
        condition: service_started
      cloud-config-service:
        condition: service_started
    ports:
      - "9141:9141"
    environment:
      - SPRING_APP_NAME=auth-service
      - EUREKA_ENABLED=true
      - SERVER_PORT=9141
      - SPRING_JPA_HIBERNATE_DDL_AUTO=validate
      - SPRING_JPA_HIBERNATE_SHOW_SQL=false
      - SPRING_JPA_HIBERNATE_FORMAT_SQL=false
      - EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE=http://${EUREKA_CLIENT_USERNAME:-registry-client}:${EUREKA_CLIENT_PASSWORD:?Set registry client password}@eureka-discovery-service:9111/eureka/
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/authdb
      - SPRING_DATASOURCE_USERNAME=theuser
      - SPRING_DATASOURCE_PASSWORD=${DB_RUNTIME_PASSWORD:?Set runtime password from local configuration}
      - SPRING_FLYWAY_USER=authadmin
      - SPRING_FLYWAY_PASSWORD=${AUTH_FLYWAY_PASSWORD:?Set authadmin password}
      - KEYCLOAK_ISSUER_URI=${KEYCLOAK_ISSUER_URI:?Set the public development issuer}
      - KEYCLOAK_API_AUDIENCE=${KEYCLOAK_API_AUDIENCE:-company-platform-api}
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://keycloak:8080/realms/company-platform/protocol/openid-connect/certs
      - SPRING_ACTIVE_PROFILE=dev
      - VAULT_HOST=vault
      - VAULT_PORT=8200
      - VAULT_TOKEN=${VAULT_TOKEN:?Set a local development Vault token}
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9141/actuator/health/readiness" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 70s
    networks:
      - apps-network

  # books microservice
  books-service:
    image: books-service:latest
    container_name: books-service
    depends_on:
      vault:
        condition: service_healthy
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      eureka-discovery-service:
        condition: service_healthy
      api-gateway:
        condition: service_started
      cloud-config-service:
        condition: service_started
    ports:
      - "9151:9151"
    environment:
      - SPRING_APP_NAME=books-service
      - CONFIG_ENABLED=true
      - CONFIG_SERVER_URL=http://cloud-config-service:9311/config
      - EUREKA_ENABLED=true
      - SPRING_CLOUD_CONFIG_USERNAME=${CONFIG_CLIENT_USERNAME:-config-client}
      - SPRING_CLOUD_CONFIG_PASSWORD=${CONFIG_CLIENT_PASSWORD:?Set Config reader password}
      - SERVER_PORT=9151
      - SPRING_JPA_HIBERNATE_DDL_AUTO=validate
      - SPRING_JPA_HIBERNATE_SHOW_SQL=false
      - SPRING_JPA_HIBERNATE_FORMAT_SQL=false
      - EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE=http://${EUREKA_CLIENT_USERNAME:-registry-client}:${EUREKA_CLIENT_PASSWORD:?Set registry client password}@eureka-discovery-service:9111/eureka/
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/booksdb
      - SPRING_DATASOURCE_USERNAME=theuser
      - SPRING_DATASOURCE_PASSWORD=${DB_RUNTIME_PASSWORD:?Set runtime password from local configuration}
      - SPRING_FLYWAY_USER=bookadmin
      - SPRING_FLYWAY_PASSWORD=${BOOKS_FLYWAY_PASSWORD:?Set bookadmin password}
      - KEYCLOAK_ISSUER_URI=${KEYCLOAK_ISSUER_URI:?Set the public development issuer}
      - KEYCLOAK_API_AUDIENCE=${KEYCLOAK_API_AUDIENCE:-company-platform-api}
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://keycloak:8080/realms/company-platform/protocol/openid-connect/certs
      - SPRING_ACTIVE_PROFILE=dev
      - VAULT_HOST=vault
      - VAULT_PORT=8200
      - VAULT_TOKEN=${VAULT_TOKEN:?Set a local development Vault token}
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9151/actuator/health/readiness" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 70s
    networks:
      - apps-network

  # video microservice
  video-service:
    image: video-service:latest
    container_name: video-service
    depends_on:
      vault:
        condition: service_healthy
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      eureka-discovery-service:
        condition: service_healthy
      api-gateway:
        condition: service_started
      cloud-config-service:
        condition: service_started
    ports:
      - "9161:9161"
    environment:
      - SPRING_APP_NAME=video-service
      - CONFIG_ENABLED=true
      - CONFIG_SERVER_URL=http://cloud-config-service:9311/config
      - EUREKA_ENABLED=true
      - SPRING_CLOUD_CONFIG_USERNAME=${CONFIG_CLIENT_USERNAME:-config-client}
      - SPRING_CLOUD_CONFIG_PASSWORD=${CONFIG_CLIENT_PASSWORD:?Set Config reader password}
      - SERVER_PORT=9161
      - SPRING_JPA_HIBERNATE_DDL_AUTO=validate
      - EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE=http://${EUREKA_CLIENT_USERNAME:-registry-client}:${EUREKA_CLIENT_PASSWORD:?Set registry client password}@eureka-discovery-service:9111/eureka/
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/videodb
      - SPRING_DATASOURCE_USERNAME=theuser
      - SPRING_DATASOURCE_PASSWORD=${DB_RUNTIME_PASSWORD:?Set runtime password from local configuration}
      - SPRING_FLYWAY_USER=videoadmin
      - SPRING_FLYWAY_PASSWORD=${VIDEO_FLYWAY_PASSWORD:?Set videoadmin password}
      - KEYCLOAK_ISSUER_URI=${KEYCLOAK_ISSUER_URI:?Set the public development issuer}
      - KEYCLOAK_API_AUDIENCE=${KEYCLOAK_API_AUDIENCE:-company-platform-api}
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://keycloak:8080/realms/company-platform/protocol/openid-connect/certs
      - SPRING_ACTIVE_PROFILE=dev
      - VAULT_HOST=vault
      - VAULT_PORT=8200
      - VAULT_TOKEN=${VAULT_TOKEN:?Set a local development Vault token}
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9161/actuator/health/readiness" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 70s
    networks:
      - apps-network

  # reviews microservice
  reviews-service:
    image: reviews-service:latest
    container_name: reviews-service
    depends_on:
      vault:
        condition: service_healthy
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      eureka-discovery-service:
        condition: service_healthy
      api-gateway:
        condition: service_started
      cloud-config-service:
        condition: service_started
    ports:
      - "9171:9171"
    environment:
      - SPRING_APP_NAME=reviews-service
      - SPRING_CLOUD_CONFIG_USERNAME=${CONFIG_CLIENT_USERNAME:-config-client}
      - SPRING_CLOUD_CONFIG_PASSWORD=${CONFIG_CLIENT_PASSWORD:?Set Config reader password}
      - SERVER_PORT=9171
      - SPRING_JPA_HIBERNATE_DDL_AUTO=validate
      - EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE=http://${EUREKA_CLIENT_USERNAME:-registry-client}:${EUREKA_CLIENT_PASSWORD:?Set registry client password}@eureka-discovery-service:9111/eureka/
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/reviewsdb
      - SPRING_DATASOURCE_USERNAME=theuser
      - SPRING_DATASOURCE_PASSWORD=${DB_RUNTIME_PASSWORD:?Set runtime password from local configuration}
      - SPRING_FLYWAY_USER=reviewsadmin
      - SPRING_FLYWAY_PASSWORD=${REVIEWS_FLYWAY_PASSWORD:?Set reviewsadmin password}
      - KEYCLOAK_ISSUER_URI=${KEYCLOAK_ISSUER_URI:?Set the public development issuer}
      - KEYCLOAK_API_AUDIENCE=${KEYCLOAK_API_AUDIENCE:-company-platform-api}
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://keycloak:8080/realms/company-platform/protocol/openid-connect/certs
      - SPRING_ACTIVE_PROFILE=dev
      - VAULT_ENABLED=true
      - VAULT_URI=http://vault:8200
      - CONFIG_ENABLED=true
      - CONFIG_SERVER_URL=http://cloud-config-service:9311/config
      - EUREKA_ENABLED=true
      - BOOKS_SERVICE_URL=http://books-service:9151
      - VIDEO_SERVICE_URL=http://video-service:9161
      - VAULT_HOST=vault
      - VAULT_PORT=8200
      - VAULT_TOKEN=${VAULT_TOKEN:?Set a local development Vault token}
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9171/actuator/health/readiness" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 70s
    networks:
      - apps-network

volumes:
  postgres:
    driver: local
  vault:
    driver: local

networks:
  apps-network:
    driver: bridge
    # Explicitly configure the network for better DNS resolution
    driver_opts:
      com.docker.network.bridge.enable_icc: "true"
      com.docker.network.bridge.enable_ip_masquerade: "true"
      com.docker.network.bridge.host_binding_ipv4: "0.0.0.0"

#networks:
#  apps-network:
#    driver: bridge
#    ipam:
#      config:
#        - subnet: 172.20.0.0/16
