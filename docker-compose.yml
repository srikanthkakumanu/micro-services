# Local development stack. Start with `make up`; see README.md.
# Settings come from .env, generated from .env.<environment>.example by `make up ENV=<environment>`.
# Its secrets are random and are copied into Vault by the bootstrap job.

name: identity-platform

# What every platform service needs to know about its surroundings inside the Compose network.
# ENVIRONMENT (dev, qa or prod) selects the Spring profile and with it the configuration files.
x-platform-addresses: &platform-addresses
  SPRING_PROFILES_ACTIVE: ${ENVIRONMENT}
  CONFIG_SERVER_URL: http://config-server:9311
  KEYCLOAK_URL: http://keycloak:8080
  KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL}
  EUREKA_URL: http://eureka-discovery:9111/eureka/

services:
  postgres:
    image: postgres:${POSTGRES_VERSION}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auth_db"]
      interval: 5s
      timeout: 3s
      retries: 20

  vault:
    image: hashicorp/vault:${VAULT_VERSION}
    # DEV ONLY: in-memory dev server with a fixed root token.
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
    cap_add:
      - IPC_LOCK
    ports:
      - "${VAULT_PORT}:8200"
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:${MAILPIT_VERSION}
    ports:
      - "${MAILPIT_UI_PORT}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:${KEYCLOAK_VERSION}
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      # Fixed public URL: `iss` is identical for tokens requested from the host and from inside
      # the network. Backchannel requests (token, JWKS, admin) may still use http://keycloak:8080.
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT}:8080"
    volumes:
      - ./keycloak/platform-realm.json:/opt/keycloak/data/import/platform-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      # The image has no curl; probe the management port with bash.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s

  # One-shot: seeds Vault, then applies client secrets and the admin password to Keycloak.
  bootstrap:
    build:
      context: .
      dockerfile: bootstrap/Dockerfile
      args:
        VAULT_VERSION: ${VAULT_VERSION}
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN}
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD}
      API_GATEWAY_VAULT_TOKEN: ${API_GATEWAY_VAULT_TOKEN}
      USER_SERVICE_VAULT_TOKEN: ${USER_SERVICE_VAULT_TOKEN}
      AUTH_SERVICE_VAULT_TOKEN: ${AUTH_SERVICE_VAULT_TOKEN}
      CONFIG_SERVER_VAULT_TOKEN: ${CONFIG_SERVER_VAULT_TOKEN}
    depends_on:
      vault:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    restart: "no"

  eureka-discovery:
    build:
      context: ../eureka-discovery
      additional_contexts:
        platform: .
    environment:
      SPRING_PROFILES_ACTIVE: ${ENVIRONMENT}
      EUREKA_INSTANCE_HOSTNAME: eureka-discovery
    ports:
      - "${EUREKA_PORT}:9111"

  config-server:
    build:
      context: ../cloud-config-service
      additional_contexts:
        platform: .
    environment:
      SPRING_PROFILES_ACTIVE: ${ENVIRONMENT}
      # The mounted service-configs checkout. qa and prod read Git by default; locally they are
      # told to read this directory too (CONFIG_REPO_TYPE in the env file).
      CONFIG_REPO_LOCATION: file:/config-repo
      CONFIG_REPO_TYPE: ${CONFIG_REPO_TYPE:-native}
      VAULT_HOST: vault
      EUREKA_ENABLED: "true"
      EUREKA_URL: http://eureka-discovery:9111/eureka/
    ports:
      - "${CONFIG_SERVER_PORT}:9311"
    volumes:
      - ../service-configs:/config-repo:ro
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      eureka-discovery:
        condition: service_healthy

  user-service:
    build:
      context: ../user-service
      additional_contexts:
        platform: .
    environment:
      <<: *platform-addresses
      DATABASE_URL: jdbc:postgresql://postgres:5432/user_db
      VAULT_URI: http://vault:8200
      VAULT_TOKEN: ${USER_SERVICE_VAULT_TOKEN}
    ports:
      - "${USER_SERVICE_PORT}:9121"
    depends_on:
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy

  auth-service:
    build:
      context: ../auth-service
      additional_contexts:
        platform: .
    environment:
      <<: *platform-addresses
      DATABASE_URL: jdbc:postgresql://postgres:5432/auth_db
      VAULT_URI: http://vault:8200
      VAULT_TOKEN: ${AUTH_SERVICE_VAULT_TOKEN}
    ports:
      - "${AUTH_SERVICE_PORT}:9141"
    depends_on:
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy

  api-gateway:
    build:
      context: ../api-gateway
      additional_contexts:
        platform: .
    environment:
      <<: *platform-addresses
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    ports:
      - "${GATEWAY_PORT}:9211"
    depends_on:
      user-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy

volumes:
  postgres-data:
