apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault
  labels:
    app: vault
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vault
  template:
    metadata:
      labels:
        app: vault
    spec:
      # Kubernetes would otherwise inject VAULT_PORT=tcp://... style variables that shadow the
      # services' own settings.
      enableServiceLinks: false
      containers:
        - name: vault
          image: hashicorp/vault:2.1.1
          # DEV ONLY: in-memory dev server. Its root token comes from the bootstrap Secret and
          # is used only by the bootstrap job.
          env:
            - name: VAULT_DEV_ROOT_TOKEN_ID
              valueFrom:
                secretKeyRef:
                  name: platform-bootstrap
                  key: VAULT_DEV_ROOT_TOKEN
            - name: VAULT_DEV_LISTEN_ADDRESS
              value: 0.0.0.0:8200
            - name: VAULT_ADDR
              value: http://127.0.0.1:8200
          ports:
            - containerPort: 8200
          securityContext:
            capabilities:
              add: ["IPC_LOCK"]
          readinessProbe:
            httpGet:
              path: /v1/sys/health
              port: 8200
            periodSeconds: 5
            timeoutSeconds: 5
          # Dev-mode Vault keeps everything in memory, so a restart loses every secret. The
          # liveness probe is deliberately slow to give up: a busy node must not kill it.
          livenessProbe:
            httpGet:
              path: /v1/sys/health
              port: 8200
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: vault
spec:
  type: ClusterIP
  selector:
    app: vault
  ports:
    - port: 8200
      targetPort: 8200
