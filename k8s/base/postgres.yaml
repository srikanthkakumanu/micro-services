apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      # Kubernetes would otherwise inject VAULT_PORT=tcp://... style variables that shadow the
      # services' own settings.
      enableServiceLinks: false
      initContainers:
        # Reads this workload's database credentials from Vault into memory. Runs as root so it
        # can hand each file to the user the main container runs as.
        - name: fetch-secrets
          image: identity-platform-bootstrap:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
          command:
            - /bin/sh
            - -c
            - >-
              until vault kv get -mount=secret postgres > /dev/null 2>&1; do echo waiting for Vault to be seeded; sleep 2; done;
              exec /bootstrap/fetch-runtime-secrets.sh
          env:
            - name: VAULT_ADDR
              value: http://vault:8200
            - name: VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: platform-bootstrap
                  key: BOOTSTRAP_VAULT_TOKEN
            - name: SECRETS_DIR
              value: /run/platform-secrets
          volumeMounts:
            - name: platform-secrets
              mountPath: /run/platform-secrets
      containers:
        - name: postgres
          image: postgres:18
          ports:
            - containerPort: 5432
          env:
            # The superuser's name and password come from Vault (see fetch-secrets above).
            - name: POSTGRES_USER_FILE
              value: /run/platform-secrets/postgres-username
            - name: POSTGRES_PASSWORD_FILE
              value: /run/platform-secrets/postgres-password
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: platform-secrets
              mountPath: /run/platform-secrets
              readOnly: true
          readinessProbe:
            exec:
              command: ["pg_isready", "-q", "-d", "postgres"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-q", "-d", "postgres"]
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: platform-secrets
          emptyDir:
            medium: Memory
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
