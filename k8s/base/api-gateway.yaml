apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels:
    app: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      # Kubernetes would otherwise inject VAULT_PORT=tcp://... style variables that shadow the
      # services' own settings.
      enableServiceLinks: false
      initContainers:
        - name: wait-for-config-server
          image: busybox:1.37
          command: ["sh", "-c", "until wget -q -O /dev/null http://config-server:9311/actuator/health/readiness; do echo waiting for config-server; sleep 3; done"]
      containers:
        - name: api-gateway
          image: identity-platform-api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9211
          # The environment's profile and addresses, supplied by the overlay.
          envFrom:
            - configMapRef:
                name: platform-settings
          env:
            - name: SERVER_PORT
              value: "9211"
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 9211
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 9211
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 9211
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  type: ClusterIP
  selector:
    app: api-gateway
  ports:
    - port: 9211
      targetPort: 9211
