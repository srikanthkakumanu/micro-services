apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Workloads only. An overlay supplies the namespace, the generated ConfigMaps (keycloak-realm,
# postgres-init, service-configs) and how the gateway is reached. Its `platform-settings`
# ConfigMap says which environment this is: SPRING_PROFILES_ACTIVE (dev, qa or prod) and the
# addresses the configuration files of that profile expect. The Secret `platform-bootstrap` is created by scripts/k8s-up.sh from the local,
# git-ignored .env and is never part of these manifests.
resources:
  - postgres.yaml
  - vault.yaml
  - mailpit.yaml
  - keycloak.yaml
  - bootstrap-job.yaml
  - eureka-discovery.yaml
  - config-server.yaml
  - user-service.yaml
  - auth-service.yaml
  - api-gateway.yaml
