# One-shot: seeds Vault, then applies client secrets and the admin password to Keycloak.
apiVersion: batch/v1
kind: Job
metadata:
  name: bootstrap
spec:
  backoffLimit: 20
  template:
    metadata:
      labels:
        app: bootstrap
    spec:
      # Kubernetes would otherwise inject VAULT_PORT=tcp://... style variables that shadow the
      # services' own settings.
      enableServiceLinks: false
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-vault-and-keycloak
          image: busybox:1.37
          command:
            - sh
            - -c
            - >-
              until wget -q -O /dev/null http://vault:8200/v1/sys/health; do echo waiting for vault; sleep 2; done;
              until wget -q -O /dev/null http://keycloak:8080/realms/platform; do echo waiting for keycloak; sleep 3; done
      containers:
        - name: bootstrap
          image: identity-platform-bootstrap:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: VAULT_ADDR
              value: http://vault:8200
            - name: VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: platform-bootstrap
                  key: VAULT_DEV_ROOT_TOKEN
            - name: KEYCLOAK_URL
              value: http://keycloak:8080
            - name: KEYCLOAK_REALM
              value: platform
          envFrom:
            - secretRef:
                name: platform-bootstrap
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
