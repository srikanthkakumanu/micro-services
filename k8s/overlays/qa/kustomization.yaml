apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The qa environment. Manifests only: it selects the qa configuration files and how the
# environment is reached, on top of the same base as dev. The base still runs Vault in dev mode
# and Mailpit, so this is the shape of a qa deployment, not a hardened one. Build with:
#   kubectl kustomize --load-restrictor LoadRestrictionsNone k8s/overlays/qa
namespace: identity-qa

resources:
  - namespace.yaml
  - ../../base
  - ingress.yaml

patches:
  - path: config-server-git.yaml
    target:
      kind: Deployment
      name: config-server

configMapGenerator:
  - name: platform-settings
    literals:
      - SPRING_PROFILES_ACTIVE=qa
      - CONFIG_SERVER_URL=http://config-server:9311
      - KEYCLOAK_URL=http://keycloak:8080
      - EUREKA_URL=http://eureka-discovery:9111/eureka/
      # The URL Keycloak is published at; it is the issuer in every token. Placeholder host.
      - KEYCLOAK_PUBLIC_URL=https://auth.qa.example.com
      - CORS_ALLOWED_ORIGINS=https://app.qa.example.com
      - EUREKA_INSTANCE_HOSTNAME=eureka-discovery
      - VAULT_HOST=vault
      # The config server serves service-configs from its Git remote at this branch or tag.
      - CONFIG_REPO_URI=https://git.example.com/platform/service-configs.git
      - CONFIG_REPO_LABEL=master
  - name: keycloak-realm
    files:
      - ../../../keycloak/platform-realm.json
