# Single source of versions for every platform service. See docs/adr/0001-version-baseline.md.
# Services import this file from their settings.gradle; do not declare versions elsewhere.
[versions]
java = "27"
spring-boot = "4.1.1"
spring-dependency-management = "1.1.7"
spring-cloud = "2025.1.3"
keycloak = "26.8.0"
keycloak-admin-client = "26.0.12"
springdoc = "3.1.1"
mapstruct = "1.6.3"
archunit = "1.5.1"
testcontainers-keycloak = "4.4.0"
jacoco = "0.8.15"

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }

[libraries]
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-cloud-dependencies = { module = "org.springframework.cloud:spring-cloud-dependencies", version.ref = "spring-cloud" }
keycloak-admin-client = { module = "org.keycloak:keycloak-admin-client", version.ref = "keycloak-admin-client" }
springdoc-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
springdoc-webflux-ui = { module = "org.springdoc:springdoc-openapi-starter-webflux-ui", version.ref = "springdoc" }
mapstruct = { module = "org.mapstruct:mapstruct", version.ref = "mapstruct" }
mapstruct-processor = { module = "org.mapstruct:mapstruct-processor", version.ref = "mapstruct" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
testcontainers-keycloak = { module = "com.github.dasniko:testcontainers-keycloak", version.ref = "testcontainers-keycloak" }
platform-security-starter = { module = "com.platform:platform-security-starter", version = "1.0.0" }
